name: verify

on:
  workflow_dispatch:
  schedule:
    # Daily production depth check during judging. GitHub may delay scheduled starts.
    - cron: "17 14 * * *"

concurrency:
  group: production-deep-check
  cancel-in-progress: false

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  live-deep:
    name: deep production WebMCP
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install native-WebMCP browser
        run: npm exec -- playwright install --with-deps chromium chromium-headless-shell
      - name: Disarm missions 2 and 3 on the production origin
        run: |
          set -eu
          for attempt in 1 2; do
            if node scripts/native-live-deep.mjs; then
              exit 0
            fi
            if [ "$attempt" -lt 2 ]; then
              sleep 30
            fi
          done
          exit 1
