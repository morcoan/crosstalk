name: test-and-deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  quality:
    name: quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reject high-severity dependency advisories
        run: npm audit --audit-level=high
      - name: Install browser engines
        run: npm exec -- playwright install --with-deps chromium chromium-headless-shell firefox webkit
      - run: npm test
      - run: npm run build
      # Full three-mission, zero-strike co-op playthrough over a modelContext stub.
      - run: npm run smoke
      # Real registerTool schema validation and native getTools/executeTool/toolchange.
      - run: npm run native
      # Hierarchy, keyboard path, target sizes, responsive layout and reduced motion.
      - run: npm run ux
      # Firefox and WebKit load the same local dist with strict runtime/network checks.
      - run: npm run xbrowser
      - name: Upload verified Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          retention-days: 30

  deploy:
    name: deploy
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: Deploy verified artifact
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  production-check:
    name: production native check
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install native-WebMCP browser
        run: npm exec -- playwright install --with-deps chromium chromium-headless-shell
      - name: Verify the deployed origin through native WebMCP
        env:
          LIVE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -eu
          for attempt in 1 2 3; do
            if node scripts/native-live.mjs "$LIVE_URL"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          exit 1
