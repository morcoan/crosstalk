    <text x="50" y="64" fill="#67271f" font-family="Arial Narrow, sans-serif" font-size="18" font-weight="700" letter-spacing="3">FIELD COMMUNICATION EXERCISE / ISSUE 04</text>
    <text x="48" y="186" fill="#29251d" font-family="Arial Black, sans-serif" font-size="104" font-weight="900" letter-spacing="-7">CROSS<tspan fill="#a43b31">TALK</tspan></text>
    <text x="52" y="240" fill="#29251d" font-family="Arial Narrow, sans-serif" font-size="34" font-weight="700">YOU SEE IT. YOUR AGENT KNOWS IT. TALK FAST.</text>
    <text x="52" y="282" fill="#5f5849" font-family="Arial, sans-serif" font-size="17">ONE DEVICE / TWO SENSES / ONE SHARED DECISION</text>
  </g>

  <g transform="translate(795 78)">
    <path d="M0 49h138V12h210v37h191v302H0z" fill="#b89e65" stroke="#6f5a35" stroke-width="3" transform="rotate(1 270 180)"/>
    <path d="M35 32h120V0h198v32h148v300H35z" fill="#355867" stroke="#1b333e" stroke-width="3" transform="rotate(-2 270 170)"/>
    <path d="M35 32h120V0h198v32h148v300H35z" fill="url(#grid)" transform="rotate(-2 270 170)"/>
