<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="500" viewBox="0 0 1440 500" role="img" aria-labelledby="title desc">
  <title id="title">CROSSTALK field workbench</title>
  <desc id="desc">A hand-illustrated desk with a taped CROSSTALK placard, case folders, wires and a field radio.</desc>
  <defs>
    <pattern id="grain" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M0 17c21-7 44 5 72-2M0 49c30 8 43-9 72-3" fill="none" stroke="#73543a" stroke-opacity=".22" stroke-width="2"/>
      <path d="M13 0v72M51 0v72" stroke="#140f0b" stroke-opacity=".08"/>
    </pattern>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0v28" fill="none" stroke="#d8e7df" stroke-opacity=".23"/>
    </pattern>
  </defs>
  <rect width="1440" height="500" fill="#30251b"/>
  <rect width="1440" height="500" fill="url(#grain)"/>
  <path d="M0 446c175-48 309 18 486-23s325 35 486-8 300 11 468-27" fill="none" stroke="#17110d" stroke-opacity=".45" stroke-width="8"/>

  <g transform="translate(62 86) rotate(-2)">
